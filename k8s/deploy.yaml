apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-app-deployment
  namespace: devops-academy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-app
  template:
    metadata:
      labels:
        app: go-app
    spec:
      containers:
      - name: go-app
        image: DOCKERHUB_USER/IMAGE_NAME:IMAGE_TAG
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: go-app-service
  namespace: devops-academy
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: go-app
